services:
  api:
    image: node:22
    container_name: api
    working_dir: /app
    command: npm start
    ports:
      - "5000:5000"
    volumes:
      - "./server:/app"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/ecommerce

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  web:
    image: node:22
    container_name: web
    working_dir: /src
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - "./client:/src"
      - /src/node_modules  
    stdin_open: true
    tty: true
    depends_on:
      - api
    env_file:
      - ./client/.env.docker 
    environment:
      - NODE_ENV=development       

volumes:
  mongo-data:


